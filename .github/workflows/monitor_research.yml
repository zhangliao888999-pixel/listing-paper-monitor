name: research-monitor

on:
  schedule:
    - cron: '20 * * * *'   # hourly at :20 UTC (discovery is cheap; enrichment batch-limited per cycle)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install deps
        run: pip install --quiet requests

      - name: research monitor (discovery + enrichment)
        continue-on-error: true
        working-directory: research
        run: python research_monitor.py

      - name: commit state
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add -A
          git commit -m "research cycle $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3; do git push && break || { git pull --rebase; sleep 3; }; done
