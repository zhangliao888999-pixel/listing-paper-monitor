name: paper-screener

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes: tracking window needs frequent discovery to not miss pools
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screener
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install deps
        run: pip install --quiet requests

      - name: screen candidates
        continue-on-error: true
        run: python screener.py

      - name: commit state
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add -A
          git commit -m "screener cycle $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3; do git push && break || { git pull --rebase; sleep 3; }; done
